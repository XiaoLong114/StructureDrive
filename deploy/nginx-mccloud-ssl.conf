server {
    listen 25560 ssl http2;
    server_name mcbe.l.cd www.mcbe.l.cd;

    ssl_certificate     /etc/nginx/ssl/mcbe.l.cd-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mcbe.l.cd-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1024m;
    error_page 497 =301 https://$host:25560$request_uri;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:25561;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 25560;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
